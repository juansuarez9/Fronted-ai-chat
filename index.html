<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis AI</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e5ecff;
      background: #0b1220;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top left, rgba(84, 140, 255, 0.18), transparent 26%),
                  radial-gradient(circle at bottom right, rgba(45, 197, 255, 0.14), transparent 22%),
                  linear-gradient(180deg, #08101f 0%, #0b1220 100%);
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.04), transparent 40%);
      pointer-events: none;
    }

    .chat-shell {
      position: relative;
      width: min(980px, 100%);
      max-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 18px;
      border-radius: 32px;
      padding: 28px;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 40px 120px rgba(5, 13, 28, 0.55);
      backdrop-filter: blur(20px);
      overflow: hidden;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .chat-header h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: -0.03em;
      color: #e9f0ff;
    }

    .chat-header p {
      margin: 8px 0 0;
      color: #b8c6e4;
      font-size: 1rem;
      line-height: 1.5;
      max-width: 620px;
    }

    .small-tag {
      font-size: 0.84rem;
      color: #cbd5e1;
      margin-top: 6px;
      opacity: 0.88;
      align-self: center;
    }

    .messages {
      overflow-y: auto;
      border-radius: 26px;
      padding: 20px;
      background: linear-gradient(180deg, rgba(14, 23, 42, 0.86), rgba(13, 19, 34, 0.95));
      box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.06);
      backdrop-filter: blur(10px);
    }

    .message {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
      align-items: flex-start;
    }

    .message:last-child {
      margin-bottom: 0;
    }

    .message.user .bubble {
      margin-left: auto;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.95), rgba(59, 130, 246, 0.9));
      color: #ffffff;
      border-radius: 22px 22px 22px 6px;
      box-shadow: 0 16px 40px rgba(37, 99, 235, 0.18);
    }

    .message.ai .bubble {
      background: rgba(17, 24, 39, 0.95);
      color: #e5ecff;
      border-radius: 22px 22px 6px 22px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.18);
    }

    .bubble {
      max-width: 85%;
      padding: 16px 18px;
      line-height: 1.72;
      white-space: pre-wrap;
      word-break: break-word;
      backdrop-filter: blur(8px);
    }

    .form-panel {
      display: grid;
      gap: 14px;
      padding: 20px;
      border-radius: 26px;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(14px);
    }

    textarea {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 20px;
      background: rgba(10, 18, 32, 0.9);
      color: #f8fbff;
      padding: 16px 18px;
      font-size: 1rem;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    textarea::placeholder {
      color: #9fb6d7;
    }

    .controls {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr auto;
      align-items: center;
    }

    .file-upload {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 18px;
      background: rgba(30, 41, 59, 0.9);
      color: #dbe3ff;
      cursor: pointer;
      border: 1px solid rgba(148, 163, 184, 0.16);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .file-upload:hover {
      background: rgba(56, 72, 107, 0.95);
      transform: translateY(-1px);
    }

    .file-upload input {
      display: none;
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 16px 24px;
      background: linear-gradient(135deg, #3b82f6, #0ea5e9);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      box-shadow: 0 18px 36px rgba(14, 165, 233, 0.24);
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .preview {
      display: grid;
      gap: 10px;
      align-items: center;
      background: rgba(10, 18, 32, 0.93);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 18px;
      padding: 14px 16px;
    }

    .preview img {
      max-width: 240px;
      border-radius: 16px;
      display: block;
      box-shadow: 0 16px 32px rgba(9, 25, 48, 0.35);
    }

    .preview p {
      margin: 0;
      color: #cbd5e1;
      font-size: 0.96rem;
    }

    .warning {
      color: #a5b4fc;
      font-size: 0.92rem;
      margin: 0;
    }
  </style>

</head>
<body>
  <section class="chat-shell">
    <div class="chat-header">
      <div>
        <h1>Jarvis AI</h1>
        <p>Bienvenido a Jarvis. Pregunta cualquier cosa, comparte una imagen si quieres y recibirás una respuesta clara y amable.</p>
      </div>
      <div class="small-tag">Jarvis AI está listo para ayudarte</div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="form-panel">
      <textarea id="user-message" placeholder="Escribe tu pregunta aquí..." rows="4"></textarea>

      <div class="preview" id="image-preview" style="display:none;">
        <p>Imagen cargada:</p>
        <img id="preview-img" src="" alt="Vista previa de la imagen" />
      </div>

      <div class="controls">
        <label class="file-upload">
          Adjuntar imagen
          <input type="file" id="image-file" accept="image/*" />
        </label>
        <button id="send-btn">Enviar a Jarvis</button>
      </div>

      <p class="warning">No es necesario cargar imagen: una consulta de texto funciona perfectamente.</p>
    </div>
  </section>

  <script>
    const apiUrl = 'https://backend-ai-chat-hadr.onrender.com/ai-chat';
    const messagesEl = document.getElementById('messages');
    const messageInput = document.getElementById('user-message');
    const sendBtn = document.getElementById('send-btn');
    const imageFileInput = document.getElementById('image-file');
    const previewEl = document.getElementById('image-preview');
    const previewImg = document.getElementById('preview-img');

    let selectedImageBase64 = null;

    function addMessage(role, text, imageUrl = null) {
      const wrapper = document.createElement('div');
      wrapper.className = `message ${role}`;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      wrapper.appendChild(bubble);

      if (imageUrl) {
        const img = document.createElement('img');
        img.src = imageUrl;
        img.alt = 'Imagen enviada';
        img.style.maxWidth = '240px';
        img.style.borderRadius = '14px';
        img.style.marginTop = '10px';
        wrapper.appendChild(img);
      }

      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function encodeFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    imageFileInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) {
        selectedImageBase64 = null;
        previewImg.src = '';
        previewEl.style.display = 'none';
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        previewImg.src = reader.result;
        previewEl.style.display = 'grid';
      };
      reader.readAsDataURL(file);
      selectedImageBase64 = await encodeFileToBase64(file);
    });

    sendBtn.addEventListener('click', async () => {
      const messageText = messageInput.value.trim();
      if (!messageText && !selectedImageBase64) {
        alert('Escribe un mensaje o carga una imagen antes de enviar.');
        return;
      }

      if (messageText) {
        addMessage('user', messageText);
      }

      if (selectedImageBase64 && previewImg.src) {
        const imageMessageText = messageText ? 'Imagen adjunta:' : '📷 Consulta con imagen';
        addMessage('user', imageMessageText, previewImg.src);
      }

      messageInput.value = '';
      imageFileInput.value = '';
      const imageBase64 = selectedImageBase64;
      previewImg.src = '';
      previewEl.style.display = 'none';

      try {
        const payload = { message: messageText };
        if (imageBase64) {
          payload.imageBase64 = imageBase64;
        }

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          throw new Error(`Error ${response.status}`);
        }

        const result = await response.json();
        const answer = typeof result === 'string' ? result : result.response || JSON.stringify(result);
        addMessage('ai', answer);
      } catch (error) {
        addMessage('ai', 'Error al conectar con el backend. Revisa la consola.');
        console.error(error);
      } finally {
        selectedImageBase64 = null;
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey && document.activeElement === messageInput) {
        event.preventDefault();
        sendBtn.click();
      }
    });

    addMessage('ai', 'Hola, soy Jarvis AI. Estoy listo para ayudarte con tu pregunta o tu imagen.');
  </script>
</body>
</html>
